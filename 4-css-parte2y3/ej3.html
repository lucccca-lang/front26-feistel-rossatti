<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <link rel="stylesheet" href="ej3.css">
</head>
<body>

    <header class="cabecera-ig">
        <div class="logo-contenedor">
            <img src="Instagram_logo.png" alt="Logo Instagram" class="logo-icono">
            <div class="usuario-nav">miguel_gomez</div>
        </div>
    </header>

    <main class="perfil-contenedor">
        <section class="info-superior">
            <img src="perfil.webp" alt="Foto perfil" class="foto-ig">
            <div class="stats-ig">
                <div class="stat-item"><strong>42</strong><span>Publicaciones</span></div>
                <div class="stat-item"><strong>3250</strong><span>Seguidores</span></div>
                <div class="stat-item"><strong>800</strong><span>Seguidos</span></div>
            </div>
        </section>
        
        <section class="bio">
            <h1>Miguel</h1>
            <p>Futbol Acassuso<br>Buenos Aires, Argentina</p>
        </section>

        <div class="tabs">
            <div class="tab activa">PUBLICACIONES</div>
            <div class="tab">REELS</div>
        </div>

        <section class="grilla-fotos">
            <div class="foto-item"><img src="amigos.jpg" alt="Publicación 1"></div>
            <div class="foto-item"><img src="caballo.jpg" alt="Publicación 2"></div>
            <div class="foto-item"><img src="comida.jpg" alt="Publicación 3"></div>
            <div class="foto-item"><img src="libros apilados.avif" alt="Publicación 4"></div>
            <div class="foto-item"><img src="taza_de_cafe.avif" alt="Publicación 5"></div>
            <div class="foto-item"><img src="trabajando.jpg" alt="Publicación 6"></div>
        </section>
    </main>

</body>
</html>
